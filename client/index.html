         The build-time injector (buildWorkers injectDefaultMeta) overrides

         tags cover new projects + the dev server without duplicating. -->

    <meta name="theme-color" content="#14161a" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <meta name="description" content="Real interview questions from OpenAI, Google, Meta, Amazon, Stripe and more. Run code in your browser and get system design feedback graded like each company." />
    <meta property="og:site_name" content="Interview Practice" />
    <meta property="og:image" content="https://interview.ugly.bot/og/site.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <style>html, body, #root { height: 100%; margin: 0; } html, body { overscroll-behavior: none; }</style>
  </head>
